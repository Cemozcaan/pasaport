<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pasaport</title>
<meta name="theme-color" content="#0F3D45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="simge-192.png">
<link rel="apple-touch-icon" href="simge-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pasaport">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Yerleşim: tek sütun telefon uygulaması; her durak bir yolculuk bileti, biten durak pasaporta damga. */
:root {
  --bg: #E8EEEC;
  --paper: #FCFCF8;
  --paper-2: #F0F4F1;
  --ink: #12262C;
  --muted: #5A6E72;
  --line: #CBD6D3;
  --accent: #E2B04A;
  --accent-ink: #1D1605;
  --you-bg: #1B5560;
  --you-fg: #F3F8F7;
  --stamp: #8E3B5E;
  --stamp-2: #1F6F8B;
  --stamp-3: #B4552D;
  --stamp-4: #3F7D52;
  --cover: #0F3D45;
  --cover-2: #0A2E35;
  --cover-ink: #F2EFE0;
  --good: #2C7A55;
  --good-bg: #DDEFE5;
  --bad: #B8433A;
  --bad-bg: #F6E0DD;
  --tip-bg: #13242C;
  --tip-fg: #F3F8F9;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1619; --paper: #142328; --paper-2: #1B2E34; --ink: #E7EEEC; --muted: #93A7A9; --line: #2A3F45;
    --accent: #EFC063; --accent-ink: #1D1605; --you-bg: #27707E; --you-fg: #F3F8F7; --stamp: #DD8FB1;
    --stamp-2: #6CBBD6; --stamp-3: #E9956D; --stamp-4: #7FC796; --cover: #12454F; --cover-2: #0C3038; --cover-ink: #F2EFE0;
    --good: #6BCB98; --good-bg: #173A2A; --bad: #EE8A80; --bad-bg: #42211E; --tip-bg: #F0B23A; --tip-fg: #1B1606; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1619; --paper: #142328; --paper-2: #1B2E34; --ink: #E7EEEC; --muted: #93A7A9; --line: #2A3F45;
  --accent: #EFC063; --accent-ink: #1D1605; --you-bg: #27707E; --you-fg: #F3F8F7; --stamp: #DD8FB1;
  --stamp-2: #6CBBD6; --stamp-3: #E9956D; --stamp-4: #7FC796; --cover: #12454F; --cover-2: #0C3038; --cover-ink: #F2EFE0;
  --good: #6BCB98; --good-bg: #173A2A; --bad: #EE8A80; --bad-bg: #42211E; --tip-bg: #F0B23A; --tip-fg: #1B1606; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
}
/* iPhone'da saat ve ada şeridi: kaydırılan içerik altından geçmesin */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.app { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { margin: 0; color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--stamp); display: grid; place-items: center; color: var(--stamp); font-size: 13px; font-weight: 800; transform: rotate(-12deg); }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Sesli / sessiz seçici */
.mode { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border-radius: 12px; padding: 4px; gap: 4px; }
.mode button { border: 0; background: transparent; border-radius: 9px; padding: 9px 8px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mode-note { margin: -8px 0 0; font-size: 13px; color: var(--muted); }

/* Bilet */
.ticket { position: relative; display: grid; grid-template-columns: 1fr 92px; background: var(--paper); border-radius: 14px;
  -webkit-mask: radial-gradient(circle 11px at calc(100% - 92px) 0, #0000 98%, #000) top/100% 51% no-repeat, radial-gradient(circle 11px at calc(100% - 92px) 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
          mask: radial-gradient(circle 11px at calc(100% - 92px) 0, #0000 98%, #000) top/100% 51% no-repeat, radial-gradient(circle 11px at calc(100% - 92px) 100%, #0000 98%, #000) bottom/100% 51% no-repeat; }
.ticket-main { padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ticket-stub { border-left: 2px dashed var(--line); padding: 20px 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 10px; text-align: center; }
.code { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; }
.ticket h2 { font-size: 30px; line-height: 1.05; font-weight: 800; }
.route-line { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; }
.route-line i { flex: 1; height: 0; border-top: 2px dotted var(--line); }
.legs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.leg { background: var(--paper-2); border-radius: 10px; padding: 8px 10px; }
.leg b { display: block; font-family: var(--f-display); font-size: 15px; }
.leg span { font-size: 12px; color: var(--muted); }
.level { font-family: var(--f-mono); font-size: 12px; border: 1.5px solid var(--ink); border-radius: 6px; padding: 2px 6px; }

.btn { border: 0; border-radius: 12px; padding: 15px 18px; font-family: var(--f-display); font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

/* Kapak: pasaportun dış yüzü ve makine okuma satırı */
.cover { background: radial-gradient(circle at 85% 0%, var(--cover) 0, var(--cover-2) 75%); color: var(--cover-ink); border-radius: 18px; padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.cover-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cover .label { color: var(--accent); }
.emblem { width: 46px; height: 46px; color: var(--accent); flex: none; }
.cover h1 { font-size: 32px; font-weight: 800; line-height: 1.1; }
.progress { height: 6px; background: rgb(255 255 255 / .16); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.cover-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; font-size: 14px; }
.mrz { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; color: rgb(242 239 224 / .62); white-space: nowrap; overflow: hidden; border-top: 1px dashed rgb(242 239 224 / .25); padding-top: 10px; }

/* Damga sayfası */
.page { background: var(--paper) repeating-radial-gradient(circle at 50% 120%, transparent 0 13px, color-mix(in srgb, var(--line) 28%, transparent) 13px 14px); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.st { aspect-ratio: 1; max-width: 100%; padding: 0; background: transparent; border: 2.5px solid currentColor; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 16px; line-height: 1; text-align: center; }
.st small { display: block; font-family: var(--f-mono); font-size: 8px; font-weight: 500; letter-spacing: .08em; margin-top: 3px; }
.st.t0 { color: var(--stamp); border-radius: 50%; transform: rotate(-9deg); }
.st.t1 { color: var(--stamp-2); border-radius: 8px; transform: rotate(6deg); }
.st.t2 { color: var(--stamp-3); border-radius: 50% 50% 8px 8px; transform: rotate(-4deg); }
.st.t3 { color: var(--stamp-4); border-radius: 8px; border-style: double; border-width: 5px; transform: rotate(10deg); }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.section-head h3 { font-size: 20px; }
.hub-title h2 { font-size: 30px; font-weight: 800; line-height: 1.1; }
.qtiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qtile { border: 0; background: var(--paper); border-radius: 14px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.qtile b { font-family: var(--f-display); font-size: 17px; line-height: 1.15; }
.qtile span { font-size: 13px; color: var(--muted); }
.qtile .num { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--paper); border-radius: 12px; padding: 4px; }
.card .seg { background: var(--paper-2); }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Zor anlar: zorluk üç tik */
.hard, .story-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; border: 0; background: var(--paper); border-radius: 14px; padding: 14px 16px; text-align: left; width: 100%; }
.hard b, .story-row b { font-family: var(--f-display); font-size: 17px; display: block; line-height: 1.2; }
.hard small, .story-row small { color: var(--muted); font-size: 13px; }
.ticks { display: flex; gap: 3px; }
.ticks i { width: 7px; height: 18px; border-radius: 2px; background: var(--line); }
.ticks i.on { background: var(--stamp-3); }
.scores { display: flex; flex-direction: column; gap: 10px; }
.score { display: grid; grid-template-columns: 110px 1fr 30px; align-items: center; gap: 10px; font-size: 14px; }
.bar { height: 8px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar.hata i { background: var(--stamp-3); }
.score b { font-family: var(--f-mono); font-size: 13px; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.q-word { font-family: var(--f-display); font-weight: 800; font-size: 36px; line-height: 1.1; overflow-wrap: anywhere; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.story { font-size: 17px; line-height: 1.6; margin: 0; }
.back { align-self: flex-start; }

.city-card { display: flex; flex-direction: column; }
.city-art { display: block; width: 100%; height: auto; border-radius: 16px 16px 0 0; }
.city-band { height: 64px; border-radius: 16px 16px 0 0; }
.city-card .ticket { border-radius: 0 0 14px 14px; }
.region { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.region:last-child { border-bottom: 0; }
.region b { font-family: var(--f-display); font-size: 16px; display: block; }
.region small { color: var(--muted); font-size: 13px; }
.region .label { font-size: 10px; }
.region .bar { grid-column: 1 / -1; }
.region.open b { color: var(--stamp-3); }
.st.tb { color: var(--accent); border-radius: 50%; border-style: double; border-width: 5px; font-size: 13px; transform: rotate(-6deg); }
.overlay { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 96%, transparent); display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.overlay-in { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; max-width: 340px; width: 100%; }
.mega { width: 190px; height: 190px; border-radius: 50%; border: 5px solid var(--st); color: var(--st); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.1; position: relative; transform: rotate(-10deg); animation: bas .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.mega::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 2px dashed var(--st); }
.mega small { display: block; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; margin-top: 4px; }
@keyframes bas { from { transform: rotate(-10deg) scale(1.9); opacity: 0; } 70% { transform: rotate(-10deg) scale(.96); opacity: 1; } to { transform: rotate(-10deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .mega { animation: none; } }
.seg.uc { grid-template-columns: repeat(3, 1fr); }
.case { background: var(--cover-2); color: var(--cover-ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.case .label { color: var(--accent); }
.case h2 { font-size: 26px; font-weight: 800; line-height: 1.1; }
.case p { margin: 0; }
.case .chip { border-color: rgb(242 239 224 / .4); align-self: flex-start; }
.timer { font-family: var(--f-display); font-weight: 800; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two > div { background: var(--paper-2); border-radius: 10px; padding: 10px 12px; }
.two b { display: block; font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.two span { font-size: 13px; color: var(--muted); }
.two .btn { font-size: 15px; padding: 12px 8px; }
.card textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--line); background: var(--paper-2); border-radius: 12px; padding: 12px; font-family: var(--f-mono); font-size: 12px; color: inherit; resize: vertical; overflow-wrap: anywhere; }
.closed { align-self: flex-start; font-family: var(--f-display); font-weight: 800; color: var(--stamp); border: 2.5px solid currentColor; border-radius: 8px; padding: 4px 10px; transform: rotate(-4deg); }
.ok-note { background: var(--good-bg); border: 1.5px solid var(--good); border-radius: 12px; padding: 10px 12px; font-size: 14px; }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
#nav-ic { max-width: 430px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
nav button { border: 0; background: transparent; border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--muted); }
nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
nav button[aria-current="page"] svg { color: var(--stamp-3); }
nav svg { width: 22px; height: 22px; }
body.has-nav { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
#ses-uyari { z-index: 15; }
body.has-nav #ses-uyari { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }

/* Seans */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.step { height: 6px; border-radius: 3px; background: var(--line); }
.step.on { background: var(--accent); }
.steps-txt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: -12px; }
.scene-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.scene-head h3 { font-size: 22px; }

.chat { display: flex; flex-direction: column; gap: 10px; min-height: 260px; }
.msg { max-width: 86%; padding: 12px 14px; border-radius: 16px; animation: gel .25s ease-out; }
@keyframes gel { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
.msg.them { background: var(--paper); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.you { background: var(--you-bg); color: var(--you-fg); border-bottom-right-radius: 4px; align-self: flex-end; }
.who { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-bottom: 2px; }
.msg-tools { display: flex; gap: 6px; margin-top: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
.tr { margin-top: 6px; font-size: 14px; color: var(--muted); font-style: italic; }

/* Üstüne gelince anlamı çıkan kelime */
.w { text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 4px; border-radius: 3px; cursor: help; }
.w:hover, .w.on { background: color-mix(in srgb, var(--accent) 35%, transparent); text-decoration-color: transparent; }
#tip { position: fixed; z-index: 20; max-width: 240px; background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 7px 11px; font-size: 14px; line-height: 1.35; pointer-events: none; box-shadow: 0 6px 20px rgb(0 0 0 / .18); }
#tip b { font-family: var(--f-display); margin-right: 6px; }
#ses-uyari { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(398px, calc(100% - 32px)); background: var(--bad-bg); color: var(--ink); border: 1.5px solid var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

.dock { background: var(--paper); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.mic-row { display: flex; align-items: center; gap: 14px; }
.mic { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.mic.listening { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 35%, transparent); }
.mic-row p { margin: 0; font-size: 14px; color: var(--muted); }
.compose { display: flex; gap: 8px; }
.compose input { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: var(--paper-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.compose button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 700; }
.hints { display: flex; flex-wrap: wrap; gap: 6px; }
.hints .chip { font-size: 14px; padding: 6px 12px; text-align: left; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.heard { background: var(--paper-2); border-radius: 12px; padding: 10px 12px; font-size: 15px; }

.card { background: var(--paper); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.fix { border-left: 3px solid var(--accent); padding-left: 12px; display: flex; flex-direction: column; gap: 2px; }
.fix s { color: var(--bad); }
.fix b { color: var(--good); }
.fix small { color: var(--muted); font-size: 14px; }

.ear-play { display: flex; align-items: center; gap: 14px; }
.speed { display: flex; gap: 6px; }
.speed .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.reveal { margin: 0; font-size: 14px; color: var(--muted); }

/* Cümle kur */
.built { min-height: 58px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.built.right { border-style: solid; border-color: var(--good); background: var(--good-bg); }
.built.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-bg); }
.pool { display: flex; flex-wrap: wrap; gap: 6px; }
.word { border: 1.5px solid var(--line); background: var(--paper-2); border-radius: 9px; padding: 7px 11px; font-size: 16px; }
.built .word { background: var(--paper); }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 14px 10px; font-size: 15px; min-height: 52px; }
.tile.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tile.done { border-color: var(--good); background: var(--good-bg); color: var(--good); cursor: default; }
.tile.no { border-color: var(--bad); background: var(--bad-bg); }
.ipa { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: block; }

.big-stamp { width: 150px; height: 150px; margin: 6px auto; border-radius: 50%; border: 4px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-weight: 800; line-height: 1.1; transform: rotate(-10deg); position: relative; }
.big-stamp::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1.5px dashed var(--stamp); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }

/* Serbest Sohbet */
.fix-line { align-self: flex-end; max-width: 88%; background: var(--paper); border-radius: 12px; padding: 10px 14px; }
.typing { color: var(--muted); font-size: 14px; font-style: italic; }
.err { background: var(--bad-bg); border: 1.5px solid var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.scene-head .chip { flex: none; }
.steps-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.card a { color: inherit; font-weight: 700; }
.card input { width: 100%; border: 1.5px solid var(--line); background: var(--paper-2); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.new-words { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.new-words b { font-family: var(--f-display); }
</style>

// Ses seçimi: önce şehrin aksanı, sonra aynı aile, sonra herhangi bir İngilizce ses. İngilizce yoksa null.
function pickVoice(list, lang) {
  const code = v => v.lang.replace("_", "-").toLowerCase();
  const en = list.filter(v => /^en(-|$)/.test(code(v)));
  const best = vs => vs.find(v => /natural|online|google/i.test(v.name)) || vs[0];
  const family = /^en-(gb|ie|au|nz|za|in|sg)$/i.test(lang) ? "en-gb" : "en-us";
  const exact = en.filter(v => code(v) === lang.toLowerCase());
  const near = en.filter(v => code(v) === family);
  return best(exact.length ? exact : near.length ? near : en) || null;
}

    const s = w.filter(x => h.includes(x)).length / Math.max(w.length, h.length);

function head(step) {
  return `<div class="top"><button class="chip" data-go="home">← Rota</button>
    <button class="chip" data-mode="${quiet() ? "sesli" : "sessiz"}">${quiet() ? ICON.mute + " Sessiz" : ICON.sound + " Sesli"}</button></div>
    <div class="steps">${LEGS().map((_, i) => `<div class="step ${i <= step ? "on" : ""}"></div>`).join("")}</div>
    <div class="steps-txt">${LEGS().map(n => `<span class="label">${n}</span>`).join("")}</div>`;
}

function ticket(i, big) {
  const s = SCENES[i];
  const bg = BOLGELER[bolgeOf(s.code)];
  return `<div class="city-card">${sehirCiz(s.code, s.city) || `<div class="city-band" style="background:linear-gradient(120deg,${bg.g[0]},${bg.g[1]})"></div>`}<div class="ticket">
    <div class="ticket-main">
      <div class="route-line"><b>${s.from}</b><i></i><b>${s.to}</b></div>
      <h2 ${big ? "" : 'style="font-size:24px"'}>${s.title}</h2>
      <p class="muted">${s.desc}</p>
    </div>
    <div class="ticket-stub"><span class="label">Durak ${i + 1}</span><span class="code">${s.code}</span><span class="level">B1</span><span class="label">20 dk</span></div>
  </div></div>`;
}

function voiceLine() {
  const list = voices();
  if (!list.length) return "";
  const v = pickVoice(list, SCENES[Math.max(next(), 0)].lang);
  return v ? ` Okuyan ses: ${esc(v.name)}.` : " Bu cihazda İngilizce ses bulunamadı.";
}

function talk() {
  const s = sc();
  const bubbles = S.chat.map((m, i) => m.you
    ? `<div class="msg you"><div class="who">Sen</div>${gloss(m.t)}</div>`
    : `<div class="msg them"><div class="who">${s.who}</div>${gloss(m.t)}
        <div class="msg-tools">${quiet() ? "" : `<button class="chip" data-say="${i}">${ICON.play} Dinle</button>`}<button class="chip" data-tr="${i}">TR ipucu</button></div>
        ${S.tr[i] ? `<div class="tr">${esc(m.tr)}</div>` : ""}</div>`).join("");
  const finished = S.turn >= s.dialog.length;
  const opts = finished ? [] : s.dialog[S.turn].opts;
  let dock;
  if (finished) dock = `<button class="btn" data-go="talkEnd">Sohbeti bitir</button>`;
  else if (quiet()) dock = `<label class="label" for="yaz">Cevabını İngilizce yaz</label>
    <form class="compose" data-send><input id="yaz" autocomplete="off" autocapitalize="sentences" placeholder="Type your answer…"><button type="submit">Gönder</button></form>
    <span class="label">Takıldıysan bir öneriye dokun</span>
    <div class="hints">${opts.map((o, i) => `<button class="chip" data-ans="${i}">${gloss(o.t)}</button>`).join("")}</div>`;
  else if (S.listening) dock = `<div class="mic-row"><button class="mic listening" aria-label="Dinliyor">${ICON.mic}</button><p><b>Dinliyorum…</b> Cevabını şimdi söyle.</p></div>`;
  else if (S.ask) dock = `${S.heard ? `<span class="label">Duyduğum</span><div class="heard">${gloss(S.heard)}</div><button class="chip" data-send-heard>Bunu cevap olarak gönder</button>` : ""}
    <span class="label">${S.noMic || !SR ? "Cevabını sesli söyle, sonra burada seç" : S.heard ? "Ya da birini seç" : "Anlayamadım, birini seç"}</span>
    <div class="options">${opts.map((o, i) => `<button class="opt" data-ans="${i}">${gloss(o.t)}</button>`).join("")}</div>
    ${S.noMic || !SR ? "" : `<button class="chip" data-mic>${ICON.mic} Tekrar konuş</button>`}`;
  else dock = `<div class="mic-row"><button class="mic" data-mic aria-label="Konuşmak için bas">${ICON.mic}</button><p>${S.noMic || !SR ? "Bu ekranda mikrofon açılamıyor. Cevabını sesli söyle, sonra düğmeye basıp seç." : "Bas ve cevabını sesli söyle."} Bilmediğin kelimenin üstüne gelince Türkçesi çıkar.</p></div>`;
  return `${head(0)}
    <div class="scene-head"><h3>${s.title}</h3><span class="label">${Math.min(S.turn + 1, s.dialog.length)} / ${s.dialog.length}</span></div>
    <div class="chat" id="chat">${bubbles}</div>
    <div class="dock">${dock}</div>`;
}

function talkEnd() {
  const fixes = S.fixes.length
    ? S.fixes.map(f => `<div class="fix"><s>${esc(f.t)}</s><b>${gloss(f.fix)}</b><small>${esc(f.why)}</small></div>`).join("")
    : `<p style="margin:0">Hiç takılmadın. Bütün cevapların doğal duruyordu.</p>`;
  return `${head(0)}
    <div class="card"><span class="label">Sohbet bitti</span><h3 style="font-size:22px">${S.fixes.length ? "Şunları böyle desen daha doğal olur" : "Çok iyiydi"}</h3>${fixes}</div>
    <button class="btn" data-go="ear">${quiet() ? "Cümle kurmaya geç" : "Dinlemeye geç"}</button>`;
}

function ear() {
  const s = sc(), q = s.ear[S.ear], answered = S.earPick !== null;
  const nextBtn = answered ? `<button class="btn" data-next-ear>${S.ear + 1 < s.ear.length ? "Sıradaki cümle" : "Kelimelere geç"}</button>` : "";
  if (quiet()) {
    if (!S.tokens.length) {
      S.tokens = q.say.split(" ");
      do { S.order = S.tokens.map((_, i) => i).sort(() => Math.random() - .5); } while (S.order.every((v, i) => v === i));
    }
    const cls = answered ? (S.earPick ? "right" : "wrong") : "";
    return `${head(1)}
      <div class="scene-head"><h3>Cümle kur</h3><span class="label">${S.ear + 1} / ${s.ear.length}</span></div>
      <div class="card">
        <span class="label">Türkçesi</span>
        <p style="margin:0;font-family:var(--f-display);font-size:21px;font-weight:700">${esc(q.tr)}</p>
        <div class="built ${cls}">${S.built.map(i => `<button class="word" data-unpick="${i}" ${answered ? "disabled" : ""}>${esc(S.tokens[i])}</button>`).join("")}</div>
        <div class="pool">${S.order.filter(i => !S.built.includes(i)).map(i => `<button class="word" data-put="${i}">${esc(S.tokens[i])}</button>`).join("")}</div>
        ${answered ? `<p class="reveal">${S.earPick ? "Doğru." : "Doğrusu:"} ${gloss(q.say)}</p>` : `<p class="reveal">Kelimelere sırayla dokun. Yanlış koyduğuna dokunursan geri gelir.</p>`}
      </div>${nextBtn}`;
  }
  return `${head(1)}
    <div class="scene-head"><h3>Kulak antrenmanı</h3><span class="label">${S.ear + 1} / ${s.ear.length}</span></div>
    <div class="card">
      <div class="ear-play"><button class="mic" data-earplay aria-label="Cümleyi dinle">${ICON.playBig}</button>
        <div style="display:flex;flex-direction:column;gap:6px"><span class="label">Hız</span>
          <div class="speed">${[[0.7, "Yavaş"], [1, "Normal"], [1.25, "Hızlı"]].map(([v, n]) => `<button class="chip" data-speed="${v}" aria-pressed="${S.speed === v}">${n}</button>`).join("")}</div></div></div>
      <p style="margin:0">Ne dendi?</p>
      <div class="options">${q.opts.map((o, i) => {
        const c = !answered ? "" : o === q.say ? "right" : i === S.earPick ? "wrong" : "";
        return `<button class="opt ${c}" data-ear="${i}" ${answered ? "disabled" : ""}>${gloss(o)}</button>`; }).join("")}</div>
      <p class="reveal">${answered ? "Anlamı: " + esc(q.tr) : "Ses gelmiyorsa ▸ düğmesine bir daha bas."}</p>
    </div>${nextBtn}`;
}

function words() {
  const W = sc().words;
  if (!S.order.length) S.order = W.map((_, i) => i).sort(() => Math.random() - .5);
  const sel = (side, i) => S.pick && S.pick.side === side && S.pick.i === i ? "sel" : "";
  const left = W.map((w, i) => `<button class="tile ${S.done.includes(i) ? "done" : sel("en", i)}" data-en="${i}" ${S.done.includes(i) ? "disabled" : ""}>${esc(w[0])}<span class="ipa">${w[2]}</span></button>`);
  const right = S.order.map(i => `<button class="tile ${S.done.includes(i) ? "done" : sel("tr", i)}" data-trw="${i}" ${S.done.includes(i) ? "disabled" : ""}>${esc(W[i][1])}</button>`);
  return `${head(2)}
    <div class="scene-head"><h3>Sohbetten çıkan kelimeler</h3><span class="label">${S.done.length} / ${W.length}</span></div>
    <p class="muted">Bu durakta geçen kelimeler. Her İngilizceyi Türkçesiyle eşleştir.</p>
    <div class="match">${left.map((l, k) => l + right[k]).join("")}</div>
    ${S.done.length === W.length ? `<button class="btn" data-go="finish">Pasaportu damgala</button>` : ""}`;
}

function finish() {
  const s = sc();
  const n = next();
  return `<div class="top"><div class="brand"><span class="brand-mark">EN</span>Pasaport</div><span class="count">${S.stamped.length} / ${SCENES.length} durak</span></div>
    <div class="card" style="text-align:center">
      <div class="big-stamp"><div>${s.city.toLocaleUpperCase("tr")}<br><span style="font-size:13px;font-family:var(--f-mono)">DURAK ${S.cur + 1}</span></div></div>
      <h2 style="font-size:26px">${s.city} tamam.</h2>
      <div class="stats"><div><b>${s.dialog.length}</b><span>${quiet() ? "cevap yazdın" : "cevap verdin"}</span></div><div><b>${S.earOk}/${s.ear.length}</b><span>${quiet() ? "cümle kurdun" : "doğru duydun"}</span></div><div><b>${s.words.length}</b><span>yeni kelime</span></div></div>
    </div>
    ${n >= 0 ? `<p class="label" style="margin:0">Sıradaki durak hemen açıldı</p>${ticket(n, false)}<button class="btn" data-start="${n}">Hemen devam et</button>` : `<div class="card"><h3>Rotanın sonuna geldin</h3><p class="muted">Yeni duraklar için Claude'a yazman yeter.</p></div>`}
    <button class="btn ghost" data-go="home">Rotaya dön</button>`;
}

// Kesintisiz bir dakika: tarayıcı dinlemeyi erken keserse süre bitene kadar yeniden başlatılır
let dkSaat = 0, dkRec = null;
function dkDur() {
  clearInterval(dkSaat);
  const r = dkRec; dkRec = null;
  if (r) { r.onend = null; try { r.stop(); } catch (e) {} }
}
function dkYaz() {
  const m = document.getElementById("dk-metin"), s = document.getElementById("dk-sayi");
  if (m) m.textContent = S.dk.metin + S.dk.ara;
  if (s) s.textContent = S.dk.kalan;
}
function dkBasla() {
  if (!SR || S.noMic) { S.dk = { hal: "bos", konu: S.dk.konu, err: "Bu tarayıcıda mikrofonla yazıya çevirme çalışmıyor. Bilgisayarda Chrome ya da Edge ile dene." }; return render(); }
  try { speechSynthesis.cancel(); } catch (e) {}
  const d = S.dk = { hal: "akis", konu: S.dk.konu, kalan: 60, metin: "", ara: "", son: Date.now(), enUzun: 0, sonuc: null, err: "" };
  render();
  const ac = () => {
    const r = new SR();
    dkRec = r;
    r.lang = "en-US"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = e => {
      const simdi = Date.now();
      d.enUzun = Math.max(d.enUzun, simdi - d.son); d.son = simdi;
      d.ara = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) d.metin += e.results[i][0].transcript.trim() + " ";
        else d.ara += e.results[i][0].transcript;
      }
      dkYaz();
    };
    r.onerror = e => {
      if (!["not-allowed", "service-not-allowed", "audio-capture", "network"].includes(e.error)) return;
      S.noMic = true; dkDur();
      S.dk = { hal: "bos", konu: d.konu, err: "Mikrofon açılamadı. Tarayıcının mikrofon iznini kontrol edip tekrar dene." };
      render();
    };
    r.onend = () => { d.metin += d.ara ? d.ara.trim() + " " : ""; d.ara = ""; try { ac(); } catch (e) {} };
    r.start();
  };
  try { ac(); } catch (e) { S.noMic = true; dkDur(); S.dk = { hal: "bos", konu: d.konu, err: "Mikrofon açılamadı." }; return render(); }
  dkSaat = setInterval(() => { d.kalan--; dkYaz(); if (d.kalan <= 0) dkBitir(); }, 1000);
}
function dkBitir() {
  dkDur();
  const d = S.dk;
  d.metin = (d.metin + d.ara).trim(); d.ara = "";
  d.enUzun = Math.max(d.enUzun, Date.now() - d.son);
  d.adet = d.metin ? d.metin.split(/\s+/).length : 0;
  d.onceki = DF.dkSon;
  d.hal = "son";
  if (d.adet) { DF.dkSon = d.adet; DF.dkEn = Math.max(DF.dkEn, d.adet); dfYaz(); dkDegerlendir(); }
  else render();
}
async function dkDegerlendir() {
  const id = ++serbestRun, d = S.dk;

    const c = await SOHBET.dakika(anahtar(), d.konu, d.metin);

    kelimeKaydet(c.words);
    c.duzeltmeler.forEach(f => DEFTER.hataEkle(DF, f)); dfYaz();
    d.sonuc = c; render();
  } catch (e) {
    if (id !== serbestRun || S.dk !== d) return;
    d.err = e.message; render();
  }
}
function dakika() {
  const d = S.dk, geri = `<button class="chip back" data-go="konus">← Oyunlar</button>`;

async function serbestIste() {
  const id = ++serbestRun;

function serbestDinle() {

  let r;
  try { r = new SR(); } catch (e) { S.noMic = true; return render(); }
  r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = e => { S.listening = false; serbestGonder(e.results[0][0].transcript); };
  r.onerror = e => {

  r.onend = () => { if (S.listening) { S.listening = false; render(); } };

  document.body.classList.toggle("has-nav", !!sekme);
  if (sekme) document.getElementById("nav-ic").innerHTML = NAV.map(([id, ad, ic]) => `<button data-sekme="${id}" ${sekme === id ? 'aria-current="page"' : ""}>${ic}${ad}</button>`).join("");
  const c = document.getElementById("chat");
  if (c && c.lastElementChild) c.lastElementChild.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if ((S.screen === "talk" || S.screen === "sohbet") && quiet()) { const y = document.getElementById(S.screen === "talk" ? "yaz" : "serbest"); if (y && matchMedia("(pointer: fine)").matches) y.focus({ preventScroll: true }); }
}
function addThem(m) { S.chat.push({ t: m.them, tr: m.tr }); render(); speak(m.them); }
function answer(t, opt) {
  S.chat.push({ you: true, t }); if (opt && opt.fix) S.fixes.push(opt);
  Object.assign(S, { ask: false, heard: "" }); S.turn++; render();
  const s = sc();
  setTimeout(() => addThem(S.turn < s.dialog.length ? s.dialog[S.turn] : s.bye), 700);
}

// Kelime anlamı balonu: fareyle üstüne gelince, dokunmatikte dokununca
function showTip(w) {
  document.querySelectorAll(".w.on").forEach(x => x.classList.remove("on"));
  w.classList.add("on");
  tip.innerHTML = `<b>${esc(w.textContent)}</b>${esc(DICT[w.dataset.w])}`;
  tip.hidden = false;
  const r = w.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let top = r.top - th - 8; if (top < 8) top = r.bottom + 8;
  tip.style.top = top + "px";
  tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8)) + "px";
}
function hideTip() { tip.hidden = true; document.querySelectorAll(".w.on").forEach(x => x.classList.remove("on")); }
document.addEventListener("pointerover", e => { const w = e.target.closest(".w"); if (w && e.pointerType === "mouse") showTip(w); });
document.addEventListener("pointerout", e => { if (e.target.closest(".w") && e.pointerType === "mouse") hideTip(); });
addEventListener("scroll", hideTip, { passive: true });

app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "serbest-form") return serbestGonder(document.getElementById("serbest").value);
  if (e.target.id === "konu-form") { const k = document.getElementById("konu").value.trim(); if (k) serbestBasla(k); return; }
  if (e.target.id === "anahtar-form") { const k = document.getElementById("anahtar").value.trim(); if (k) { anahtarYaz(k); render(); } return; }
  if (e.target.id === "hikaye-form") { const k = document.getElementById("hikaye").value.trim(); if (k) hikayeIste(k); return; }
  const v = document.getElementById("yaz").value.trim(); if (!v) return;
  const opt = sc().dialog[S.turn].opts.find(o => norm(o.t) === norm(v));
  answer(v, opt);
});

app.addEventListener("input", e => { if (e.target.id === "serbest") S.draft = e.target.value; });
function git(ekran) {
  try { speechSynthesis.cancel(); } catch (e) {}
  S.screen = ekran; render(); window.scrollTo({ top: 0 });
}
nav.addEventListener("click", e => { const b = e.target.closest("[data-sekme]"); if (b) git(b.dataset.sekme); });
app.addEventListener("click", e => {
  const w = e.target.closest(".w");
  if (w && e.pointerType !== "mouse" && !w.closest("button")) { w.classList.contains("on") ? hideTip() : showTip(w); return; }
  const b = e.target.closest("button"); if (!b) { hideTip(); return; }
  const d = b.dataset, s = sc();
  if (d.mode) { S.mode = d.mode; S.tokens = []; S.built = []; if (S.screen === "ear") { S.earPick = null; S.order = []; } try { speechSynthesis.cancel(); } catch (x) {} save(); return render(); }
  if (d.start) { Object.assign(S, fresh(), { cur: +d.start, screen: "talk" }); window.scrollTo({ top: 0 }); return addThem(sc().dialog[0]); }
  if (d.go) {
    if (d.go === "finish") {
      if (!S.stamped.includes(S.cur)) { S.stamped.push(S.cur); save(); }
      durakKelime(S.cur);
      S.damga = { ust: s.code, baslik: s.city + " tamam.", yazi: `Bu durağın ${s.words.length} kelimesi Defter'e eklendi, tekrar sırana girdi.` };
      damgaSesi();
    }
    if (d.go === "sohbetSon" && S.final !== null && S.bolum === 2 && S.bolumSent >= FINAL_MESAJ) {
      if (!S.finaller.includes(S.final)) { S.finaller.push(S.final); save(); }
      S.damga = { bolge: true, ust: BOLGELER[S.final].kod, baslik: BOLGELER[S.final].ad + " bitti.", yazi: "Bölge damgası pasaportuna basıldı. Karnen hazırlanıyor." };
      damgaSesi();
    }
    if (d.go !== S.screen && (d.go === "ear" || d.go === "words")) S.order = [];
    if (d.go === "sohbetSon" || d.go === "dinle") { try { speechSynthesis.cancel(); } catch (x) {} }
    if (d.go === "dakika") S.dk = { hal: "bos" };
    if (d.go === "telefon") Object.assign(S, fresh());
    S.screen = d.go; render(); window.scrollTo({ top: 0 }); if (d.go === "ear") speak(s.ear[0].say);
    if (d.go === "sohbetSon" && karneli() && S.sent && !S.karne) karneIste();
    return;
  }
  if ("damgaKapa" in d) { S.damga = null; return render(); }
  if (d.kar) { S.kar = +d.kar; save(); return render(); }
  if (d.hiz) { S.speed = +d.hiz; save(); return render(); }
  if (d.gec) {
    const k = DF.sohbetler[+d.gec];
    Object.assign(S, fresh(), { screen: "sohbet", topic: k.topic, zor: k.zor ?? null, rol: k.rol ?? null, odak: k.odak || "", kar: k.kar || 0, chat: k.chat, hist: k.hist, fixes: k.fixes || [], sent: k.sent, kayitId: k.id });
    window.scrollTo({ top: 0 });
    return render();
  }
  if (d.rol) {
    if (!anahtar()) { S.screen = "konus"; return render(); }
    return serbestBasla(ROLLER[+d.rol].ad, { rol: +d.rol, zor: null });
  }
  if (d.tel) {
    if (!anahtar()) { S.screen = "konus"; return render(); }
    return serbestBasla(TELEFON[+d.tel].ad, { screen: "telefon", tel: +d.tel, telBas: Date.now(), zor: null });
  }
  if ("telYazi" in d) { if (!S.telYazi) S.telActi++; S.telYazi = !S.telYazi; return render(); }
  if ("telTekrar" in d) { const m = [...S.chat].reverse().find(x => x.t && !x.you); if (m) speak(m.t); return; }
  if ("telBitir" in d) { serbestRun++; try { speechSynthesis.cancel(); } catch (x) {} S.listening = false; S.telSure = ""; S.screen = "telSon"; return render(); }
  if (d.lvl) { S.seviye = d.lvl; SOHBET.seviyeAyarla(d.lvl); save(); return render(); }
  if (d.final) {
    if (!anahtar()) { S.screen = "konus"; return render(); }
    return serbestBasla(BOLGELER[+d.final].final.baslik, { final: +d.final, bolum: 0, bolumSent: 0, finalHist: [] });
  }
  if ("finalNext" in d) {
    S.finalHist.push(...S.hist);
    Object.assign(S, { hist: [{ role: "user", basla: true, text: "Start the scene with your first line." }], bolum: S.bolum + 1, bolumSent: 0 });
    return serbestIste();
  }
  if ("detNew" in d) {
    if (!anahtar()) { S.screen = "konus"; return render(); }
    Object.assign(S, fresh(), { screen: "sohbet", topic: "Dedektif", detWait: true }); window.scrollTo({ top: 0 });
    return detIste();
  }
  if ("detTr" in d) { S.detTr = !S.detTr; return render(); }
  if (d.verdict) { S.detSec = +d.verdict; S.screen = "detSon"; try { speechSynthesis.cancel(); } catch (x) {} window.scrollTo({ top: 0 }); return render(); }
  if ("dkBasla" in d) return dkBasla();
  if ("dkBitir" in d) return dkBitir();
  if ("dkKonu" in d) { S.dk = { hal: "bos", konu: yeniKonu(S.dk.konu) }; return render(); }
  if ("dkDegerlendir" in d) return dkDegerlendir();
  if (d.yedek) { Object.assign(S, { yedek: d.yedek, yedekSonuc: null }); return render(); }
  if ("yedekAktar" in d) return yedekAktar();
  if ("yedekKopya" in d) {
    const k = document.getElementById("yedek-kod");
    k.select();
    const tamam = () => { b.textContent = "Kopyalandı"; };
    if (navigator.clipboard) navigator.clipboard.writeText(k.value).then(tamam, () => { b.textContent = "Seçili: elle kopyala"; });
    else b.textContent = "Seçili: elle kopyala";
    return;
  }
  if (d.phone) { S.phone = d.phone; return render(); }
  if (d.seg) { S.seg = d.seg; S.screen = "konus"; return render(); }
  if (d.zor) return serbestBasla(ZOR[+d.zor].t, { zor: +d.zor });
  if ("karneRetry" in d) return karneIste();
  if (d.av) return avBasla(d.av);
  if ("avRetry" in d) return avIste();
  if (d.avp) { S.av.pick = +d.avp; if (S.av.pick === S.av.list[S.av.i].a) S.av.ok++; return render(); }
  if ("avNext" in d) { S.av.i++; S.av.pick = null; return render(); }
  if (d.odak) return serbestBasla(d.odak + " pratiği", { odak: d.odak });
  if (d.dq) {
    const q = S.dq, en = q.list[q.i]; q.pick = +d.dq;
    const dogru = q.opts[q.pick] === DF.words[en].tr;
    if (dogru) q.ok++;
    DEFTER.cevapla(DF, en, dogru, Date.now()); dfYaz();
    return render();
  }
  if ("dqNext" in d) { S.dq.i++; dqSoru(); return render(); }
  if ("dqRedo" in d) { S.dq = null; return render(); }
  if (d.hikaye) return hikayeIste(d.hikaye);
  if (d.story) return hikayeAc(+d.story);
  if ("oku" in d) return hikayeOku();
  if ("dur" in d) { try { speechSynthesis.cancel(); } catch (x) {} return; }
  if ("reveal" in d) { S.reveal = true; return render(); }
  if (d.sq) { S.sPick = +d.sq; return render(); }
  if ("sqNext" in d) { S.sq++; S.sPick = null; return render(); }
  if (d.topic) return serbestBasla(d.topic);
  if ("keyDel" in d) { anahtarYaz(""); Object.assign(S, fresh(), { screen: "konus", sErr: "" }); return render(); }
  if ("freeMic" in d) return serbestDinle();
  if ("freeRetry" in d) return S.detWait ? detIste() : serbestIste();
  if ("mic" in d) return listen();
  if ("sendHeard" in d) return answer(S.heard, null);
  if (d.say) return speak(S.chat[+d.say].t);
  if (d.tr) { S.tr[d.tr] = !S.tr[d.tr]; return render(); }
  if (d.ans) { const o = s.dialog[S.turn].opts[+d.ans]; return answer(o.t, o); }
  if ("earplay" in d) return speak(s.ear[S.ear].say);
  if (d.speed) { S.speed = +d.speed; save(); render(); return speak(s.ear[S.ear].say); }
  if (d.ear) { S.earPick = +d.ear; if (s.ear[S.ear].opts[S.earPick] === s.ear[S.ear].say) S.earOk++; return render(); }
  if (d.put) {
    S.built.push(+d.put);
    if (S.built.length === S.tokens.length) { S.earPick = S.built.map(i => S.tokens[i]).join(" ") === s.ear[S.ear].say; if (S.earPick) S.earOk++; }
    return render();
  }
  if (d.unpick) { S.built = S.built.filter(i => i !== +d.unpick); return render(); }
  if ("nextEar" in d) {
    Object.assign(S, { earPick: null, tokens: [], built: [], order: [] });
    if (++S.ear >= s.ear.length) S.screen = "words";
    render(); if (S.screen === "ear") speak(s.ear[S.ear].say); return;
  }
  if (d.en || d.trw) {
    const side = d.en ? "en" : "tr", i = +(d.en || d.trw);
    if (!S.pick || S.pick.side === side) { S.pick = { side, i }; return render(); }
    if (S.pick.i === i) { S.done.push(i); S.pick = null; return render(); }
    S.pick = null; b.classList.add("no"); setTimeout(render, 450);
  }
});
try { speechSynthesis.getVoices(); } catch (e) {}
render();
</script>
